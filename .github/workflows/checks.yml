name: Checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  prototype:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Install native graphics libraries for MediaPipe
        run: sudo apt-get update && sudo apt-get install -y libegl1 libgl1
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            requirements.txt
            constraints.txt
      - run: python -m pip install -r requirements.txt
      - run: python -m unittest discover -s tests -v
      - run: python setup_assets.py
      - run: python app.py --check
      - run: python app.py --clip rocket --snapshot previews/rocket.png
